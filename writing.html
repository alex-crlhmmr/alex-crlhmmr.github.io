<head>

<title>Writing &mdash; Alexandre Carlhammar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%230c0c0c'/><text x='16' y='22' font-family='monospace' font-size='16' font-weight='bold' fill='%23c9a84c' text-anchor='middle'>AC</text></svg>">
<meta name="description" content="Writing by Alexandre Carlhammar. Essays on manufacturing, reindustrialization, and building systems.">
<meta name="author" content="Alexandre Carlhammar">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0c0c0c;
    --fg: #d4d4d4;
    --fg-dim: #737373;
    --fg-bright: #f5f5f5;
    --accent: #c9a84c;
    --accent-dim: #8a7233;
    --rule: #262626;
    --max-w: 72ch;
  }

  html {
    font-size: 15px;
    -webkit-text-size-adjust: 100%;
  }

  body {
    font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.65;
    padding: 3rem 1.5rem 6rem;
    max-width: var(--max-w);
    margin: 0 auto;
    font-weight: 400;
    letter-spacing: -0.01em;
  }

  a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--accent-dim);
    transition: border-color 0.15s;
  }
  a:hover {
    border-color: var(--accent);
  }

  nav {
    margin-bottom: 3rem;
    font-size: 0.8rem;
  }

  nav a {
    color: var(--fg-dim);
    border-bottom-color: var(--rule);
  }
  nav a:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  h1 {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--fg-bright);
    letter-spacing: -0.03em;
    margin-bottom: 2rem;
  }

  .essay-item {
    margin-bottom: 2rem;
  }

  .essay-item a.essay-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--fg-bright);
    border-bottom-color: var(--rule);
  }
  .essay-item a.essay-title:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .essay-item .essay-subtitle {
    font-size: 0.8rem;
    color: var(--fg-dim);
    font-weight: 300;
    font-style: italic;
    margin-top: 0.25rem;
  }

  .essay-item .essay-date {
    font-size: 0.75rem;
    color: var(--fg-dim);
    font-weight: 300;
    margin-top: 0.2rem;
  }

  footer {
    margin-top: 4rem;
    padding-top: 1rem;
    border-top: 1px solid var(--rule);
    font-size: 0.7rem;
    color: var(--fg-dim);
    font-weight: 300;
  }

  @media (max-width: 520px) {
    html { font-size: 14px; }
    body { padding: 2rem 1.25rem 4rem; }
  }
</style>
</head>
<body>

<nav>
  <a href="/">&larr; Alexandre Carlhammar</a>
</nav>

<div class="essay-item">

  <p class="essay-subtitle">Why the West cannot reindustrialize without putting manufacturing first</p>
  <p class="essay-date">March 2026</p>
</div>

<footer>
  <a href="/">&larr; back</a>
</footer>

</body>
